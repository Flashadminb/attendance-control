<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Control — เข้าสู่ระบบ</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<script src="./config.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       font-family:"Archivo","Noto Sans Thai",system-ui,sans-serif;background:#f3f2f2;color:#201e1d}
  .wrap{width:min(430px,100%)}
  h1{font-size:clamp(26px,6vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0}
  .kick{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7d7979;margin:8px 0 26px}
  form{border:2px solid rgba(32,30,29,.4);background:#eae9e9;padding:20px}
  label{display:block;font-size:12px;color:#605d5d;margin-bottom:5px}
  input{width:100%;min-height:40px;padding:8px 10px;font:inherit;font-size:15px;color:#201e1d;
        background:#fff;border:1px solid rgba(32,30,29,.4);border-radius:0}
  input:focus-visible{outline:none;border-color:#ec3013}
  .field+.field{margin-top:14px}
  button{width:100%;margin-top:18px;min-height:44px;border:0;cursor:pointer;background:#ec3013;color:#f3f2f2;
         font-family:inherit;font-weight:800;font-size:15px}
  button:hover{background:#dd2b0f}
  button:disabled{opacity:.5;cursor:not-allowed}
  .remember{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:12px;color:#605d5d;cursor:pointer;line-height:1.4}
  .remember input{width:16px;height:16px;min-height:0;flex:none;margin-top:1px;accent-color:#ec3013;cursor:pointer}
  .msg{margin-top:14px;font-size:13px;padding:10px 12px;display:none}
  .msg.err{display:block;background:#ffe0d9;border:1px solid #ec3013;color:#7c1405}
  .msg.ok{display:block;background:#e6f4ec;border:1px solid #5cb87f;color:#1f5c39}
  .setup{margin-top:18px;border-top:2px solid rgba(32,30,29,.4);padding-top:14px;font-size:12px;color:#605d5d;line-height:1.6}
  .setup summary{cursor:pointer;font-weight:600;color:#201e1d}
  .setup input{margin-top:8px;font-size:13px;min-height:34px}
  code{font-family:ui-monospace,monospace;font-size:11px;background:#f8f4f4;padding:1px 4px}
</style>
</head>
<body>
<main class="wrap">
  <h1>ATTENDANCE CONTROL</h1>
  <div class="kick">HCM Daily Processing</div>

  <!-- ถ้าเคยล็อกอินค้างไว้ ไม่ต้องกรอกซ้ำ — แต่ยังเปลี่ยนไปใช้ชื่ออื่นได้ -->
  <div id="back" style="display:none;border:2px solid rgba(32,30,29,.4);background:#eae9e9;padding:20px;">
    <div style="font-size:12px;color:#605d5d;">เข้าสู่ระบบค้างไว้ในชื่อ</div>
    <div id="backwho" style="font-weight:800;font-size:20px;margin:4px 0 2px;"></div>
    <div id="backrole" style="font-size:12px;color:#605d5d;"></div>
    <button id="cont" type="button">เข้าใช้งานต่อ</button>
    <button id="switch" type="button"
      style="background:transparent;color:#ae1800;border:1px solid rgba(32,30,29,.4);margin-top:8px;">
      ออกจากระบบ / เข้าด้วยชื่ออื่น
    </button>
  </div>

  <form id="f" autocomplete="on">
    <div class="field">
      <label for="u">ยูสเซอร์</label>
      <input id="u" name="username" autocomplete="username" required autocapitalize="none" spellcheck="false">
    </div>
    <div class="field">
      <label for="p">รหัสผ่าน</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
    </div>
    <label class="remember" for="rm">
      <input id="rm" type="checkbox" checked>
      <span>ให้จำการเข้าสู่ระบบไว้ 30 วัน (ไม่ต้องล็อกอินใหม่ทุกครั้ง)</span>
    </label>
    <button id="go" type="submit">เข้าสู่ระบบ</button>
    <div id="m" class="msg"></div>

    <!-- ปกติซ่อนไว้ — โผล่เฉพาะตอนยังไม่ได้ตั้งค่าใน config.js หรือต่อไม่ติด -->
    <details class="setup" id="cfg" style="display:none;">
      <summary>ตั้งค่าการเชื่อมต่อ (สำหรับแอดมิน)</summary>
      <div style="margin-top:8px;">ปกติค่านี้ตั้งไว้ในไฟล์ <code>config.js</code> แล้ว ไม่ต้องกรอกเอง<br>
        ช่องนี้ใช้ตอนยังไม่ได้ตั้ง หรือ URL เปลี่ยนแล้วยังไม่ได้แก้ในโค้ด</div>
      <input id="ep" placeholder="https://script.google.com/macros/s/..../exec">
    </details>
  </form>
</main>

<script>
(function () {
  var EP_KEY = 'hcm-sync-endpoint-v1';
  var SESSION_KEY = 'hcm-session-v1';
  var f = document.getElementById('f'), m = document.getElementById('m'),
      go = document.getElementById('go'), ep = document.getElementById('ep'), cfg = document.getElementById('cfg');

  function endpoint() { return (ep.value || '').trim(); }
  function say(text, kind) { m.textContent = text; m.className = 'msg ' + (kind || 'err'); }

  // ลำดับความสำคัญ: ค่าที่ตั้งไว้กลางใน config.js → ค่าที่เครื่องนี้เคยใช้
  // ตั้งไว้ใน config.js แล้วผู้ใช้ทั่วไปจะไม่เห็นช่องกรอก URL เลย
  var central = (window.HCM_CONFIG && window.HCM_CONFIG.endpoint || '').trim();
  var local = '';
  try { local = ((JSON.parse(localStorage.getItem(EP_KEY) || 'null') || {}).endpoint || '').trim(); } catch (e) {}
  ep.value = central || local;
  if (!ep.value) { cfg.style.display = 'block'; cfg.open = true; }


  // ── ล็อกอินค้างไว้ ──────────────────────────────────────────────────
  var sess = null;
  try { sess = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) {}
  if (sess && sess.me && sess.token) {
    var back = document.getElementById('back');
    document.getElementById('backwho').textContent = sess.me.name || sess.me.user;
    document.getElementById('backrole').textContent =
      sess.me.isAdmin ? 'แอดมิน — เห็นทุกกะ' : ('หัวหน้ากะ — ดูแล ' + (sess.me.shiftText || '—'));
    back.style.display = 'block';
    f.style.display = 'none';
    document.getElementById('cont').onclick = function () { location.href = './app.html'; };
    document.getElementById('switch').onclick = function () {
      // แจ้งเซิร์ฟเวอร์ให้ทิ้งบัตรผ่านใบเดิมด้วย ไม่ใช่ลบแค่ในเครื่อง
      try {
        if (sess.endpoint && sess.token) {
          fetch(sess.endpoint + (sess.endpoint.indexOf('?') >= 0 ? '&' : '?')
            + 'action=logout&token=' + encodeURIComponent(sess.token)).catch(function () {});
        }
      } catch (e) {}
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
      back.style.display = 'none';
      f.style.display = 'block';
    };
  }

  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    var url = endpoint();
    if (!url) {
      cfg.style.display = 'block'; cfg.open = true;
      say('ยังไม่ได้ตั้งค่าการเชื่อมต่อ — แอดมินต้องใส่ Web app URL ใน config.js หรือกรอกในช่องด้านล่าง');
      return;
    }

    var user = document.getElementById('u').value.trim();
    var pass = document.getElementById('p').value;
    // Apps Script ใช้เวลาราวสองถึงสามวินาที ถ้าไม่บอกอะไรเลยผู้ใช้จะนึกว่าค้าง
    go.disabled = true;
    var tick = 0;
    say('กำลังตรวจสอบ…', 'ok');
    var timer = setInterval(function () {
      tick++;
      if (tick === 3) say('กำลังเชื่อมต่อ Google… (ครั้งแรกของวันจะช้ากว่าปกติ)', 'ok');
      if (tick === 8) say('ยังรออยู่… เซิร์ฟเวอร์ตอบช้ากว่าปกติ', 'ok');
    }, 1000);
    var done = function () { clearInterval(timer); };

    try {
      // ส่งด้วย POST รหัสผ่านจะได้ไม่ไปโผล่ใน URL หรือ log
      // ใช้ Content-Type text/plain เพื่อเลี่ยง preflight ที่ Apps Script ไม่รองรับ
      var r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', user: user, pass: pass,
          remember: document.getElementById('rm').checked })
      });
      var d = await r.json();
      done();
      if (!d.ok) { say(d.error || 'เข้าสู่ระบบไม่สำเร็จ'); go.disabled = false; return; }

      // เก็บ endpoint กับบัตรผ่าน — ไม่เก็บรหัสผ่านไว้ในเครื่อง
      try {
        var cur = JSON.parse(localStorage.getItem(EP_KEY) || 'null') || {};
        cur.endpoint = url;
        localStorage.setItem(EP_KEY, JSON.stringify(cur));
        localStorage.setItem(SESSION_KEY, JSON.stringify({
          me: d.me, token: d.token, endpoint: url, at: new Date().toISOString()
        }));
      } catch (e2) {}

      say('ยินดีต้อนรับ ' + (d.me.name || d.me.user), 'ok');
      location.href = './app.html';
    } catch (err) {
      done();
      // ต่อไม่ติด — กางช่องตั้งค่าให้แอดมินแก้ URL ได้ทันที
      cfg.style.display = 'block';
      say('ต่อกับเซิร์ฟเวอร์ไม่ได้ — ตรวจว่า Web app URL ถูกต้อง และตั้ง Who has access เป็น Anyone');
      go.disabled = false;
    }
  });
})();
</script>
</body>
</html>
